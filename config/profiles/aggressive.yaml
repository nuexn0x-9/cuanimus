# CUANIMUS Aggressive Preset Profile
environment:
  env_name: paper
  dry_run: true
  live_trading_enabled: false

market:
  pairs:
    - ADA/USDT:USDT
    - ETH/USDT:USDT
    - XRP/USDT:USDT
  base_timeframe: 15m
  context_timeframe: 1h

strategy:
  strategy_id: hybrid_v2c
  long_enabled: true
  short_enabled: true

risk:
  profile_name: aggressive
  risk_per_trade_pct: 1.5
  max_leverage: 7.0
  max_daily_loss_pct: 5.0
  max_drawdown_pct: 20.0
  max_pair_exposure_pct: 40.0
  max_total_exposure_pct: 95.0

execution:
  profile_name: aggressive
  entry_order_type: limit
  slippage_model: STRESS
  slippage_pct: 0.25

ai:
  enabled: false
